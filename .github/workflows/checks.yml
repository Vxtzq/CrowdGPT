name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Python files compile
        run: git ls-files '*.py' | xargs python -m py_compile

      - name: Shell scripts parse
        run: |
          bash -n install.sh
          bash -n docker/install-deps.sh
          bash -n docker/docker-entrypoint.sh
          bash -n docker/run.sh

      - name: Docker Compose overlays validate
        run: |
          for overlay in cuda cuda-noruntime rocm xpu cpu; do
            docker compose -f docker-compose.yml -f "docker-compose.${overlay}.yml" config -q
          done

      # Fails when client.py / client.html changed after the release was signed,
      # i.e. when clients that are behind would fail the update hash check.
      # Only on pushes: contributors can't sign, so it would always fail on PRs.
      - name: Release signature matches client files
        if: github.event_name == 'push'
        run: python tools/sign_release.py verify
