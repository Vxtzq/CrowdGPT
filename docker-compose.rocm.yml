services:
  crowdgpt:
    image: crowdgpt:rocm
    build:
      args:
        # docker/run.sh picks BASE_IMAGE, TORCH_INDEX and BNB_ROCM_ARCH from the detected GPU
        # (ROCm 10.2 for supported GPUs, 6.4 otherwise); these defaults apply without it.
        BASE_IMAGE: "${BASE_IMAGE:-rocm/pytorch:rocm10.2.0_ubuntu24.04_py3.12_pytorch_release_2.15.0}"
        BACKEND: rocm
        TORCH_INDEX: "${TORCH_INDEX:-https://download.pytorch.org/whl/rocm10.1}"
        INSTALL_BITSANDBYTES: source
        # Empty builds bitsandbytes for its default GPU list (slower build, larger library).
        BNB_ROCM_ARCH: "${BNB_ROCM_ARCH:-}"
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    # ROCm needs the host IPC namespace: without it the first GPU allocation aborts with
    # "Memory critical error ... Memory in use". podman-compose ignores this key, so
    # docker/run.sh passes --ipc=host itself when it falls back to podman-compose.
    ipc: host
    # Host IPC uses the host's /dev/shm; podman refuses --shm-size together with it.
    shm_size: !reset null
    ulimits:
      memlock: -1
    environment:
      HIP_VISIBLE_DEVICES:
      ROCR_VISIBLE_DEVICES:
      HSA_OVERRIDE_GFX_VERSION:
      PYTORCH_HIP_ALLOC_CONF: "expandable_segments:False"
      MIOPEN_CUSTOM_CACHE_DIR: /data/cache/miopen
      HIP_CACHE_DIR: /data/cache/hip
      CROWDGPT_ROCM_AUTOUPDATE: "${CROWDGPT_ROCM_AUTOUPDATE:-0}"
